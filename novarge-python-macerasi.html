<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Novarge Python Macerası</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
body{margin:0;min-height:100vh;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",Arial,sans-serif;color:#4a3f8f;background:linear-gradient(160deg,#c9f0ff,#fff3c4 55%,#ffd9ec)}
[hidden]{display:none!important}
button{font:inherit;font-size:22px;font-weight:700;border:0;border-radius:24px;padding:10px 18px;margin:5px;background:#fff;color:#4a3f8f;box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
button:disabled{opacity:.4}
#top{display:flex;align-items:center;padding:8px 12px;gap:6px}
#top button{font-size:20px;padding:8px 12px}
#bar{flex:1;height:18px;background:#fff;border-radius:9px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
#fill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7ed957,#ffd23f);transition:width 1s}
#app{max-width:720px;margin:0 auto;padding:4px 14px 30px;text-align:center}
h1{font-size:clamp(30px,8vw,52px);margin:8px 0 16px;color:#ff5c9d;text-shadow:3px 3px 0 #fff;line-height:1.1}
h2{font-size:clamp(22px,5vw,30px);margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{color:#fff;margin:0;padding:18px 6px;font-size:clamp(20px,5vw,28px);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.card b{display:block;font-size:clamp(44px,12vw,70px);text-shadow:none}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;align-items:center}
.emo{font-size:clamp(70px,20vw,110px);line-height:1.1}
.tile{min-width:64px;height:62px;font-size:26px;background:#ffe27a;font-family:ui-monospace,Consolas,monospace;white-space:pre}
.key{min-width:48px;padding:6px 0;font-size:24px;background:#d6f5ff;margin:3px}
.slot{min-width:50px;height:64px;margin:4px;border-bottom:6px solid #ffb703;font-size:44px;font-weight:700;color:#ff5c9d}
.bub{background:#fff;border-radius:24px;padding:10px 16px;font-size:clamp(22px,6vw,34px);font-weight:700;color:#e6397d;margin:8px 0}
#msg{height:34px;font-size:26px;color:#e6397d;font-weight:700}
.code{background:#fffbe6;border:3px dashed #ffb703;border-radius:20px;padding:12px 16px;font:700 clamp(18px,5vw,26px)/1.4 ui-monospace,Consolas,monospace;text-align:left;margin:8px auto;max-width:460px;min-height:56px;white-space:pre;overflow-x:auto;color:#4a3f8f}
.k{color:#e6397d;font-style:normal}.s{color:#1e9e5a;font-style:normal}
.term,.opt{background:#1e2a44;color:#7fffd4;font:700 clamp(20px,5vw,26px)/1.4 ui-monospace,Consolas,monospace;border-radius:18px;padding:10px 18px;margin:8px auto;max-width:460px}
.opt{min-width:100px;border-radius:22px}
#gr{display:grid;grid-template-columns:repeat(5,auto);justify-content:center;gap:3px;margin:8px 0}
.c{position:relative;background:#fff;border:2px solid #cfe8ff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px}
.rb{position:absolute;width:72%;height:72%;border-radius:50%;background:#2d8fd5;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.nb{font-size:28px;margin:0 4px}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#ov{position:fixed;inset:0;z-index:9;background:#fff8dc;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
</style></head><body>
<div id="top"><button onclick="menu()">🏠</button><div id="bar"><i id="fill"></i></div><b id="st"></b><button onclick="par()">👨‍👩‍👧</button></div>
<main id="app"></main><div id="ov" hidden></div>
<script>
const $=q=>document.querySelector(q),A=$('#app'),R=n=>Math.floor(Math.random()*n),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const L=[..."ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ"],PR=["Harikasın!","Bravo!","Çok güzel!","Süpersin!","Aferin!"];
const W=[["ANA","👩"],["BABA","👨"],["ELMA","🍎"],["KEDİ","🐱"],["KUŞ","🐦"],["TOP","⚽"],["AY","🌙"],["GÜL","🌹"],["SU","💧"],["EV","🏠"],["MUZ","🍌"],["BALIK","🐟"]];
const HW=["Merhaba","Elma","Kedi","Ali","Ay","Selam","Top","Ela","Güneş"];
const PG=[[['ad = "Ali"','print(ad)'],'Ali'],[['sayi = 5','print(sayi)'],'5'],[['for i in range(3):','    print("Hop")'],'Hop Hop Hop'],[['ad = "Ela"','print(ad)','print("Bravo")'],'Ela, Bravo'],[['print("Merhaba")','for i in range(2):','    print("Hop")'],'Merhaba, Hop, Hop']];
const LV2=[[0,4,0,0,3],[0,4,0,0,2],[0,4,0,1,4],[0,4,0,1,3],[0,4,0,2,4]],LV3=[[0,4,1,3,4],[0,0,2,0,3],[4,4,3,1,4],[2,4,0,2,1],[0,2,1,4,2]],DX=[0,1,0,-1],DY=[-1,0,1,0];
const ST=[["👋","Merhaba Python","#ff5c9d"],["🤖","Robotu Yürüt","#f08a24"],["🔁","Tekrar Et","#27ae60"],["⌨️","Kodu Yaz","#2d8fd5"],["🔍","Kodu Oku","#9b59b6"],["🧩","Program Kur","#e74c3c"]];
let stars=+ld('py_s')||0,un=+ld('py_u')||1,lim=+ld('py_l')||15,lock=0,S=-1,n=0,it=[];
const D=new Date().toISOString().slice(0,10);let sec=+ld('py_t'+D)||0;
function say(t,r=.8){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.toLocaleLowerCase('tr'));u.lang='tr-TR';u.rate=r;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
let AC;function beep(f,d=.15){try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const ok=()=>{beep(660);setTimeout(()=>beep(880),120)},bad=()=>beep(200,.25);
const shk=()=>{A.classList.remove('shake');void A.offsetWidth;A.classList.add('shake')};
const cc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\b(print|for|in|range)\b/g,'<i class=k>$1</i>').replace(/("[^"]*")/g,'<i class=s>$1</i>');
const hd=t=>`<div>${it.map((_,k)=>k<n?'⭐':k==n?'🔵':'⚪').join('')}</div><h2>${t}</h2><div id=msg></div>`;
function upd(){$('#st').textContent='⭐'+stars;$('#fill').style.width=Math.max(0,100-sec/(lim*60)*100)+'%'}
function menu(){S=-1;try{speechSynthesis.cancel()}catch(e){}A.innerHTML=`<h1>🐍 Novarge<br>Python Macerası</h1><div class=grid>${ST.map((x,i)=>`<button class=card style="background:${x[2]}" ${i>=un?'disabled':''} onclick="play(${i})"><b>${i<un?x[0]:'🔒'}</b>${x[1]}</button>`).join('')}</div>`}
function play(i){S=i;n=0;it=[()=>sh(HW).slice(0,5),()=>LV2,()=>LV3,()=>sh(W.filter(x=>x[0].length<5)).slice(0,5),()=>[0,0,0,0,0],()=>sh(PG).slice(0,4)][i]();round()}
function round(){lock=0;if(n>=it.length)return fin();[hello,rob,rob,wr,rd,prog][S](it[n])}
function win(){if(lock)return;lock=1;ok();stars++;sv('py_s',stars);upd();$('#msg').textContent=PR[R(5)]+' 🎉';setTimeout(()=>{n++;round()},1700)}
function fin(){if(S+2>un){un=S+2;sv('py_u',un)}A.innerHTML=`<div class=emo>🏆</div><h2>Tebrikler, Küçük Programcı!</h2><div class=emo>⭐${stars}</div><div class=row><button onclick="play(S)">🔁 Tekrar</button><button onclick="menu()">🏠 Menü</button></div>`;say('Aferin! Harikasın!')}
function hello(w){const tk=['print','(',`"${w}"`,')'];let T=sh([...tk,'[']).map(x=>({x,u:0})),got=[];
const dr=()=>A.innerHTML=hd('Kodu sırayla dokun!')+`<div class=bub>Ekranda ${w} yazsın</div><div class=code>${cc(got.join('')||'…')}</div>${got.length==4?`<div class=term>${w}</div>`:''}<div class=row>${T.map((o,k)=>`<button class=tile ${o.u?'disabled':''} onclick="hk(${k})">${o.x}</button>`).join('')}</div>`;
window.hk=k=>{const o=T[k];if(o.u||got.length>3)return;if(o.x==tk[got.length]){o.u=1;got.push(o.x);beep(500+got.length*80);dr();if(got.length==4){say('Ekrana '+w+' yazdı');win()}}else{bad();shk()}};dr();say('Ekrana '+w+' yazdır')}
function rob([sx,sy,sd,gx,gy]){const lp=S==2,cs=Math.min(60,Math.floor((innerWidth-50)/5)),NM={i:'ileri',s:'sağa dön',l:'sola dön'};let px=sx,py=sy,d=sd,P=[],N=2,busy=0;
const cd=()=>{const l=P.map(c=>({i:'robot.ileri()',s:'robot.sag()',l:'robot.sol()'}[c]));return(lp?[`for i in range(${N}):`,...l.map(x=>'    '+x)]:l).join('\n')||'# komut ekle'};
const dr=()=>{let g='';for(let y=0;y<5;y++)for(let x=0;x<5;x++)g+=`<div class=c style="width:${cs}px;height:${cs}px">${x==gx&&y==gy?'⭐':''}${x==px&&y==py?`<b class=rb style="transform:rotate(${d*90}deg)">▲</b>`:''}</div>`;
A.innerHTML=hd(lp?'Tekrar sayısını seç!':'Robotu yıldıza götür!')+`<div id=gr>${g}</div><div class=code>${cc(cd())}</div><div class=row><button onclick="ad('i')">⬆️ ileri</button><button onclick="ad('l')">↩️ sol</button><button onclick="ad('s')">↪️ sağ</button></div><div class=row>${lp?`<button onclick="nn(-1)">➖</button><b class=nb>🔁 ${N}</b><button onclick="nn(1)">➕</button>`:''}<button onclick="go()">▶️ Çalıştır</button><button onclick="bk()">⌫</button><button onclick="rs()">🔊</button></div>`};
window.ad=c=>{if(busy)return;if(P.length>=(lp?2:6))return bad();P.push(c);beep(500);dr()};
window.bk=()=>{if(!busy){P.pop();dr()}};window.nn=v=>{if(!busy){N=Math.min(6,Math.max(1,N+v));dr()}};
window.rs=()=>say((lp?N+' kere tekrarla. ':'')+P.map(c=>NM[c]).join(', '));
const end=()=>{if(px==gx&&py==gy){say('Aferin!');win()}else{bad();$('#msg').textContent='Tekrar dene! 🔄';setTimeout(()=>{px=sx;py=sy;d=sd;busy=0;dr()},1300)}};
window.go=()=>{if(busy||!P.length)return;busy=1;px=sx;py=sy;d=sd;dr();const q=[];for(let k=0;k<(lp?N:1);k++)q.push(...P);let k=0;const t=setInterval(()=>{if(k>=q.length){clearInterval(t);end();return}const c=q[k++];if(c=='i'){const a=px+DX[d],b=py+DY[d];if(a>=0&&a<5&&b>=0&&b<5){px=a;py=b;beep(440)}else bad()}else d=(d+(c=='s'?1:3))%4;dr()},550)};
dr()}
function wr([w,e]){const c=[...w];let got=[];
const dr=()=>A.innerHTML=hd('Duyduğun kelimeyi yazdır!')+`<div class=emo>${e}</div><div class=code>${cc(`print("${w.slice(0,got.length)+'_'.repeat(c.length-got.length)}")`)}</div>${got.length==c.length?`<div class=term>${w}</div>`:''}<div class=row><button onclick="say('${w}')">🔊</button><button onclick="ky(c0())">💡</button></div><div class=row>${c.map((_,k)=>`<div class=slot>${got[k]||''}</div>`).join('')}</div><div class=row>${L.map(x=>`<button class=key onclick="ky('${x}')">${x}</button>`).join('')}</div>`;
window.c0=()=>c[got.length];window.ky=x=>{if(got.length>=c.length)return;if(x==c[got.length]){got.push(x);beep(600);dr();if(got.length==c.length){say('Ekrana '+w+' yazdı');win()}}else{bad();shk()}};dr();say(w)}
function rd(){const a=n%2==0;let code,sp,ans,o,h=a?'':["Hop","Bip","Selam"][R(3)];
if(a){const w=W[R(W.length)][0];o=sh([w,...sh(W.filter(x=>x[0]!=w)).slice(0,2).map(x=>x[0])]);code=`print("${w}")`;sp='Ekrana '+w+' yazdır';ans=w}
else{const k=2+R(3);o=sh([k,k-1,k+1]);code=`for i in range(${k}):\n    print("${h}")`;sp=k+' kere tekrarla. Ekrana '+h+' yazdır';ans=k}
A.innerHTML=hd('Kod ekrana ne yazdırır?')+`<div class=code>${cc(code)}</div><button onclick="say('${sp}')">🔊 Dinle</button><div class=row>${o.map(x=>`<button class=opt onclick="pk(this,${x==ans})">${a?x:Array(x).fill(h).join('<br>')}</button>`).join('')}</div>`;
window.pk=(b,r)=>{if(r){say(sp);win()}else{bad();b.disabled=1;shk()}};say(sp)}
function prog([ls,out]){let T=sh(ls.map(x=>({x,u:0}))),got=[];
const dr=()=>A.innerHTML=hd('Satırları sırayla dokun!')+`<div class=bub>Ekranda: ${out}</div><div class=code>${cc(got.join('\n')||'…')}</div>${got.length==ls.length?`<div class=term>${out.split(', ').join('<br>')}</div>`:''}<div class=col>${T.map((o,k)=>`<button class=tile ${o.u?'disabled':''} onclick="pt(${k})">${o.x}</button>`).join('')}</div>`;
window.pt=k=>{const o=T[k];if(o.u||got.length>=ls.length)return;if(o.x==ls[got.length]){o.u=1;got.push(o.x);beep(500+got.length*80);dr();if(got.length==ls.length){say('Program çalıştı. '+out);win()}}else{bad();shk()}};dr();say('Ekranda '+out+' görünsün')}
function gate(){const a=3+R(6),b=3+R(6);return +prompt(`Ebeveyn doğrulaması: ${a} + ${b} = ?`)==a+b}
function par(){if(!gate())return;const v=+prompt('Günlük oyun süresi (dakika):',lim);if(v>0){lim=v;sv('py_l',v)}if(confirm('Tüm bölümler açılsın mı?')){un=7;sv('py_u',7)}if(confirm('Bugünkü süre sayacı sıfırlansın mı?')){sec=0;sv('py_t'+D,0)}upd();menu()}
function brk(){try{speechSynthesis.cancel()}catch(e){}const o=$('#ov');o.hidden=0;o.innerHTML=`<div class=emo>🌳</div><h2>Mola zamanı!</h2><p style="font-size:22px">Bugünkü oyun süren doldu.<br>Su iç, biraz zıpla, camdan dışarı bak!</p><button onclick="more()">👨‍👩‍👧 Ebeveyn: +10 dk</button>`}
function more(){if(gate()){sec=Math.max(0,sec-600);$('#ov').hidden=1;upd()}}
setInterval(()=>{if(document.hidden||!$('#ov').hidden)return;sec++;if(sec%10==0)sv('py_t'+D,sec);upd();if(sec>=lim*60)brk()},1000);
upd();menu();
</script></body></html>
